version: "3"

# Built-in variables used: ROOT_DIR
output: prefixed

vars:
  OS:
    sh: go env GOOS
  ARCH:
    sh: go env GOARCH

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the binary
    cmds:
      - mkdir -p {{.ROOT_DIR | shellQuote}}/bin/{{.OS}}-{{.ARCH}}
      - GOOS={{.OS}} GOARCH={{.ARCH}} go build -o {{.ROOT_DIR | shellQuote}}/bin/{{.OS}}-{{.ARCH}}/rex-whichkey ./cmd
      - chmod +x {{.ROOT_DIR | shellQuote}}/bin/{{.OS}}-{{.ARCH}}/rex-whichkey

  run:
    desc: Build this checkout and launch the shared Lua float from an explicit Rex origin
    cmds:
      - |
        set -eu
        : "${REX_SESSION:?task run requires the originating REX_SESSION}"
        : "${REX_BLOCK:?task run requires the originating REX_BLOCK}"
        command -v rex >/dev/null
      - task: build
      - |
        set -eu
        source_directory={{.ROOT_DIR | shellQuote}}
        build_directory={{.ROOT_DIR | shellQuote}}/bin/{{.OS}}-{{.ARCH}}
        set --
        if [ "${REX_CLIENT+x}" = x ]; then
          : "${REX_CLIENT:?REX_CLIENT must be an original full client ID when present}"
          set -- -C "$REX_CLIENT"
        fi
        exec rex "$@" do "$source_directory/lua/rex_whichkey.lua" \
          -s "$REX_SESSION" -b "$REX_BLOCK" --action rex_whichkey_launch \
          {{.CLI_ARGS}} development_directory="$build_directory"

  clean:
    desc: Clean /bin directory
    cmds:
      - rm -rf {{.ROOT_DIR}}/bin

  install:
    desc: Install the binary using go install
    cmds:
      - GOOS={{.OS}} GOARCH={{.ARCH}} go install ./cmd

  lint:
    desc: Run all linters
    cmds:
      - task: lint:vet
      - task: lint:golangci
      - task: lint:ai

  lint:vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:golangci:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run -v -c {{.ROOT_DIR}}/.golangci.yml

  lint:ai:
    desc: Run go-ai-lint with all analyzers
    cmds:
      - >-
        go-ai-lint
        -concurrencylint
        -contextlint
        -deferlint
        -errorlint
        -goroutinelint
        -initlint
        -interfacelint
        -naminglint
        -optionlint
        -paniclint
        -slicemaplint
        -stringlint
        ./...

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:race

  test:unit:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run race tests
    cmds:
      - go test -race ./...

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy
